# Agent tasks for the GUI Failure Lab (mobile).
#
# The app is one realistic device: a Home springboard (route "/") with app icons.
# Each task starts on Home so the agent must discover and open the right page.
#
# Baseline vs faulty is a single GLOBAL flag, not part of the URL. Set it before
# each run via the Settings screen (gear icon on Home) or by pre-seeding
# localStorage['gui-lab:mode'] = 'baseline' | 'faulty'. Every task is run once
# per mode; the listed `defect` is the ground-truth code that the faulty variant
# arms (rendered as testID="defect:<CODE>" on the affected screen).

mobile:
  - task: Add the Nike Air Max Pulse to your cart.
    app: Shop
    start_route: /
    target_screen: /shop/product/12
    defect: B_NON_CLICKABLE_NORMAL_CTA

  - task: Filter the shop to only show products priced at $100 or less.
    app: Shop
    start_route: /
    target_screen: /shop
    defect: M_CUSTOM_SLIDER_MISSING_A11Y_SEMANTICS

  - task: Find the iOS Developer role and tell me its salary range.
    app: Careers
    start_route: /
    target_screen: /careers
    defect: B_ASYNC_CONTENT_LATE_RENDER

  - task: Open the Senior Frontend Engineer role at Acme Corp and save it.
    app: Careers
    start_route: /
    target_screen: /careers/job/acme
    defect: B_CLICK_NO_VISIBLE_EFFECT

  - task: Pause the track that's playing (Midnight Reverie).
    app: Music
    start_route: /
    target_screen: /music/player/midnight
    defect: M_ACTION_NOT_EXPOSED_IN_TREE

  - task: Open a song in Music, skip to the next track, then go back to the previous one.
    app: Music
    start_route: /
    target_screen: /music/player/ocean
    defect: B_GHOST_ELEMENT_NO_BACKING_NODE

  - task: Share Anna's hiking post.
    app: Social
    start_route: /
    target_screen: /social
    defect: M_MISSING_ACCESSIBLE_NAME

  - task: Archive the Figma newsletter email.
    app: Mail
    start_route: /
    target_screen: /mail
    defect: B_SWIPE_AMBIGUOUS_DIRECTION

  - task: Delete the "Buy groceries" task.
    app: Tasks
    start_route: /
    target_screen: /tasks
    defect: B_LONG_PRESS_ONLY_CONTEXT_MENU

  - task: Set the alarm for 07:30.
    app: Clock
    start_route: /
    target_screen: /clock
    defect: B_DENSE_TOUCH_TARGETS

  - task: Dismiss the "New Feature Available" announcement, then read out today's revenue.
    app: Dashboard
    start_route: /
    target_screen: /dashboard
    defect: B_BLOCKING_MODAL_NO_CLOSE
